<style>
  :root{ --ink:#0C0A09; --brass:#C9A24B; --oxblood:#8A3A34; --bone:#F3ECDD; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--ink);overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--ink)}

  /* branded splash */
  #splash{position:fixed;inset:0;z-index:10;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    transition:opacity .5s ease;font-family:'Heebo',sans-serif}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .pole{position:absolute;top:0;left:0;right:0;height:5px;
    background:repeating-linear-gradient(115deg,var(--brass) 0 12px,var(--oxblood) 12px 24px,var(--bone) 24px 36px);
    background-size:200% 100%;animation:slide 5s linear infinite}
  @keyframes slide{to{background-position:200% 0}}
  #splash img{width:190px;height:auto;animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  #splash .bar{width:120px;height:3px;border-radius:3px;margin-top:26px;overflow:hidden;background:rgba(201,162,75,.15)}
  #splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:var(--brass);animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
  #splash .cap{margin-top:14px;font-size:11px;letter-spacing:.28em;color:rgba(243,236,221,.45);text-transform:uppercase}
</style>
