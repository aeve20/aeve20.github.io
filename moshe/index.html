<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Boutique by Moshe — קביעת תור</title>

<!-- Printed QR posters still encode this old address. Forward every visitor to
     the branded URL so the address bar shows go4tor.co.il, not github.io. -->
<link rel="canonical" href="https://go4tor.co.il/moshe">
<meta http-equiv="refresh" content="0; url=https://go4tor.co.il/moshe">

<style>
  html,body{margin:0;height:100%;background:#0C0A09;color:#F3ECDD;
            font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .bar{width:120px;height:4px;border-radius:3px;margin:0 auto 18px;
       background:repeating-linear-gradient(115deg,#C9A24B 0 10px,#8A3A34 10px 20px,#F3ECDD 20px 30px);
       animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  p{font-size:14px;color:#9C8E7B;margin:0}
  a{color:#C9A24B}
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="bar"></div>
      <p>מעבירים אותך לקביעת תור…</p>
      <p style="margin-top:10px"><a href="https://go4tor.co.il/moshe">לחצו כאן אם הדף לא נטען</a></p>
    </div>
  </div>

<script>
  // Belt and braces: replace() so the old URL doesn't linger in history,
  // meaning the back button returns to wherever the visitor came from.
  location.replace("https://go4tor.co.il/moshe");
</script>
</body>
</html>
